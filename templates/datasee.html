<style>   
.modal {
    display:    none;

    z-index:    1000;

/* When the body has the loading class, we turn
   the scrollbar off with overflow:hidden */

}

<body style="background-color:#87CEEB">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  	<div style="    position: fixed;

         <h4 style="display:inline-block;padding:15;margin:0;float:left;"></h4>
<a href="/"><i class='fa fa-home' style='font-size:25px;color:black;float:right;padding:7px; '></i></a>
</div>
<div class="container">
				<center><h3 style="margin:0;color:blue;"><b>ನೀರು ಬಳಕೆದಾರರ ಸಹಕಾರ ಸಂಘ ನಿಯಮಿತ ಕಾಗೆಕೊಡಮಗ್ಗೆ ,ಭದ್ರಾವತಿ</b></h3>
	</center><hr>
   <center>
  <div class="form-inline" >
    <div class="form-group">
      <label for="email"><b style="font-size:20px;color:blue;">ಪಾಸ್ ಪುಸ್ತಕ ಸಂಖ್ಯೆ::</label>
      <input type="number" class="form-control" id="p" placeholder="Enter passbook number" name="p"></b>
    </div>

    <button type="submit" id="send" class="btn btn-default">Submit</button>
  </div>

  </center>
 <hr>
<div id="newone">
  </div>
</div>

   <script> 
$("#send").click(function(){
    a=document.getElementById('p').value
    text=a+','+"";
    $.ajax({
      url: "/datasee1",
      type: "get",
      data: {jsdata: text},
      success: function(response) {
        $("#newone").html(response);
      },
      error: function(xhr) {
        //Do Something to handle error
      }
    });
});
</script> 

 
  <script>
$body = $("body");
$("#send").on("click",()=>{
$body.addClass("loading")
});
</script>  

  <div class="modal"><!-- Place at bottom of page --></div>
  <script>
$body = $("body");

$(document).on({
    ajaxStart: function() { $body.addClass("loading");    },
     ajaxStop: function() { $body.removeClass("loading"); }    
});
</script>
</body>
</html>

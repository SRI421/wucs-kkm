<style>
  * { box-sizing: border-box; }

  .info-container {
    font-family: 'Segoe UI', Arial, sans-serif;
    padding: 0;
  }

  .table-wrapper {
    overflow-x: auto;
    border-radius: 10px;
    box-shadow: 0 4px 20px rgba(0,0,0,.3);
  }

  table {
    width: 100%;
    border-collapse: collapse;
    background: #0d1e30;
    font-size: 13px;
  }
  caption {
    font-size: 14px;
    font-weight: 700;
    color: #7ec8e3;
    padding: 14px 12px 10px;
    text-align: center;
    line-height: 1.6;
    background: #0a1825;
    border-bottom: 1px solid #1a3a5a;
  }
  thead th {
    background: #0d2840;
    color: #7ec8e3;
    padding: 10px 14px;
    font-size: 12px;
    font-weight: 600;
    text-align: center;
    border-bottom: 2px solid #2a5070;
    white-space: nowrap;
  }
  tbody tr { border-bottom: 1px solid #1a3050; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:nth-child(even) { background: rgba(255,255,255,.03); }
  tbody tr:hover { background: rgba(126,200,227,.08); transition: background .15s; }
  td {
    padding: 10px 14px;
    color: #c8dde8;
    text-align: center;
    vertical-align: middle;
  }
  td:first-child { color: #e8f4f8; font-weight: 500; }

  .empty-state {
    padding: 32px;
    text-align: center;
    color: #4a7090;
    font-size: 14px;
  }
</style>

<div class="info-container">
  <div class="table-wrapper">
    <table>
      <caption>ನೀರು ಬಳಕೆದಾರರ ಸಹಕಾರ ಸಂಘ ನಿಯಮಿತ<br>ಕಾಗೆಕೊಡಮಗ್ಗೆ, ಭದ್ರಾವತಿ</caption>
      <thead>
        <tr>
          <th>ಖಾತೆದಾರರ ಹೆಸರು</th>
          <th>ಪಾಸ್ ಪುಸ್ತಕ ಸಂಖ್ಯೆ</th>
          <th>ಸರ್ವೆ ನಂ.</th>
          <th>ಒಟ್ಟು ವಿಸ್ತೀರ್ಣ</th>
        </tr>
      </thead>
      <tbody>
        {% if data %}
          {% for i in data %}
          <tr>
            <td>{{ i['name'] }}</td>
            <td>{{ i['pass'] }}</td>
            <td>{{ i['sno'] }}</td>
            <td>{{ i['acers'] }}</td>
          </tr>
          {% endfor %}
        {% else %}
          <tr><td colspan="4" class="empty-state">ಯಾವುದೇ ಮಾಹಿತಿ ಇಲ್ಲ</td></tr>
        {% endif %}
      </tbody>
    </table>
  </div>
</div>
